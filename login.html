<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
    }

    /* 
      FLAG -> GITHUB_


      If you are seeing this, may you too get a lesbian girlfriend
    */
    
    .card {
      width: 100%;
      max-width: 360px;
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 16px;
      font-size: 22px;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #0969da;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      background: #0969da;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.95;
    }

    .note {
      margin-top: 12px;
      font-size: 12px;
      color: #57606a;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Login</h1>

    <form onsubmit="return handleLogin(event)">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Enter your password" required minlength="6" />

      <button type="submit">Sign In</button>
      <div class="note">This is a demo form (no real authentication).</div>
    </form>
  </div>

  <script>
    function handleLogin(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      // Demo only: show entered values (never do this in real apps)
      alert(`Logged in as: ${email}\nPassword length: ${password.length}`);

      // Return false to prevent actual form submission
      return false;
    }
  </script>
</body>
</html>
